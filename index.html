<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOTUS Cafe Display</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

/* منو */
.menu{
    width:100vw;
    height:100vh;
    object-fit:cover;
    display:block;
}

/* لایه لوگو */
#logoPopup{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,0.55);

    opacity:0;
    visibility:hidden;

    transition:opacity 1s ease;
    z-index:9999;
}

#logoPopup.show{
    opacity:1;
    visibility:visible;
}

/* لوگو */
#logoPopup img{

    width:min(700px,80vw);

    filter:
    drop-shadow(0 0 15px #FFD700)
    drop-shadow(0 0 40px #FFD700)
    drop-shadow(0 0 80px #FFD700);

    animation:logoZoom 5s ease forwards;
}

@keyframes logoZoom{

    0%{
        opacity:0;
        transform:scale(.75);
    }

    20%{
        opacity:1;
        transform:scale(1);
    }

    80%{
        opacity:1;
        transform:scale(1.05);
    }

    100%{
        opacity:0;
        transform:scale(.95);
    }

}

</style>
</head>

<body>

<img src="menu-main.png" class="menu" alt="Menu">

<div id="logoPopup">
    <img src="logo-cinematic-gold.png" alt="LOTUS Logo">
</div>

<script>

const logoPopup = document.getElementById("logoPopup");

function showLogo(){

    logoPopup.classList.add("show");

    setTimeout(() => {
        logoPopup.classList.remove("show");
    }, 5000);

}

/* اولین نمایش بعد از 5 ثانیه */
setTimeout(showLogo, 5000);

/* هر 5 دقیقه */
setInterval(showLogo, 300000);

</script>

</body>
</html>
